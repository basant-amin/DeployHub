# DeployHub — nginx site, MVP (plain HTTP).
#
# Copy to /etc/nginx/sites-available/deployhub, set `server_name`, symlink into sites-enabled,
# `nginx -t`, then `systemctl reload nginx`. Full procedure in ../docker.md § nginx.
#
# Additive by design: no `default_server`, no changes to any existing site. On a host that
# already serves another application, declaring a second default server on port 80 makes
# `nginx -t` fail with "a duplicate default server" — so this block relies on name-based
# matching instead, which wins over the default server whenever the Host header matches.
#
# The dashboard is published on the host's loopback only (127.0.0.1:8080), so this file is the
# only route to it.
#
# HTTPS is deliberately absent for the MVP validation window. Read the warning at the bottom
# before exposing port 80 to the internet.

map $http_upgrade $deployhub_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    listen      [::]:80;

    # Change this. Not `_`, and not default_server.
    server_name deployhub.example.com;

    access_log /var/log/nginx/deployhub.access.log;
    error_log  /var/log/nginx/deployhub.error.log;

    # The largest request the dashboard makes is the project form. Nothing uploads.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # Required both for keepalive to the upstream and for any Upgrade to work.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $deployhub_connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Off, deliberately. Next streams its RSC payload, and the deployment screens re-render
        # on a one-second poll while a build runs. Buffering holds those responses until they
        # complete, which turns a live log into a stuttering one. The usual cost — a slow client
        # occupying an upstream connection — does not matter for an internal dashboard.
        proxy_buffering off;

        # Every route is force-dynamic. A cached dashboard is a dashboard that lies about what
        # is deployed, so never add proxy_cache here.
        proxy_cache off;

        # Fail fast when the container is down or restarting rather than hanging the browser.
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # The app issues its own redirects (/ → /signin); nginx must not rewrite them.
        proxy_redirect off;
    }
}

# WebSockets: DeployHub does not use them. Live updates are `router.refresh()` over ordinary
# HTTP, which is why there is only ever one copy of the data. The upgrade handling above is
# included because it costs nothing and is verified working (101), and because Next's dev
# server would need it.
#
# ---------------------------------------------------------------------------------------------
# Before exposing port 80 to the internet
#
# `DEPLOYHUB_PASSWORD` is a root credential on this host: the container holds
# /var/run/docker.sock, so anyone who signs in can `docker run --privileged`. Over plain HTTP
# that password and the session cookie cross the network in cleartext, and the session is an
# HMAC with no expiry — a captured cookie stays valid until the password is rotated.
#
# Until TLS is in front of this, restrict who can reach it:
#
#   sudo ufw allow from YOUR.IP.ADDR.ESS to any port 80 proto tcp
#
# or skip nginx during validation and tunnel instead, which is strictly safer:
#
#   ssh -L 8080:127.0.0.1:8080 you@vps      # then open http://127.0.0.1:8080
# ---------------------------------------------------------------------------------------------
